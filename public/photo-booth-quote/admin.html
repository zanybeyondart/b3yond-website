<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><base href="/"><title>Private quotations · B3YOND</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="review.css"><link rel="stylesheet" href="admin.css"><script type="module" src="admin.js"></script></head><body><div id="site"><header class="masthead"><div class="wrap mast-inner"><div class="brand"><img src="assets/b3yond-logo.png" alt="B3YOND"><span>Private quotations</span></div><button id="logout" class="dialog-btn" hidden>Sign out</button></div></header><main class="wrap"><div class="page-heading"><h1 id="heading">Your quotations</h1></div><p id="status" role="status"></p><section id="login" hidden><form id="login-form" class="auth-card"><h2 id="login-title">Owner sign-in</h2><label for="password">Password</label><input id="password" type="password" minlength="12" maxlength="128" autocomplete="current-password" required><p id="login-hint">Enter your private dashboard password.</p><button class="dialog-btn primary">Sign in</button></form></section><section id="dashboard" hidden><p>Quotes are recorded when a visitor reaches review. All amounts are before VAT.</p><div id="quotes"></div><button id="more" class="dialog-btn" hidden>Load older quotes</button></section><section id="detail" hidden><div class="admin-actions"><button id="back-list" class="dialog-btn">Back to quotations</button><button id="print" class="dialog-btn primary">Print / Save PDF</button></div><p id="quote-meta"></p><div id="quote-content"></div></section></main></div><div id="print-view"></div></body></html>
